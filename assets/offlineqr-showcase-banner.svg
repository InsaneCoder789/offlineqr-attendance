<svg width="2400" height="1320" viewBox="0 0 2400 1320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OfflineQR Attendance showcase banner</title>
  <desc id="desc">A professional GitHub showcase banner for OfflineQR Attendance, a dynamic QR based offline attendance system for institutions.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="2400" y2="1320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#FAFCFB"/>
