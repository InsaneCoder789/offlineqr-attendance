  <rect x="96" y="322" width="92" height="5" rx="2.5" fill="#159A53"/>
  <text x="96" y="424" font-family="Inter, Aptos, Segoe UI, Arial, sans-serif" font-size="34" font-weight="500" fill="#1D2823">
    <tspan x="96" dy="0">OfflineQR lets institutions record classroom attendance</tspan>
    <tspan x="96" dy="52">securely, even when the internet is unavailable.</tspan>
  </text>
  <text x="96" y="574" font-family="Inter, Aptos, Segoe UI, Arial, sans-serif" font-size="33" font-weight="500" fill="#1D2823">
    <tspan x="96" dy="0">It uses </tspan><tspan fill="#159A53" font-weight="850">rotating QR challenges</tspan><tspan>, </tspan><tspan fill="#159A53" font-weight="850">one-device identity</tspan><tspan>,</tspan>
    <tspan x="96" dy="52">and </tspan><tspan fill="#159A53" font-weight="850">signed offline proofs</tspan><tspan> that sync when connectivity returns.</tspan>
  </text>
  <text x="96" y="742" font-family="Inter, Aptos, Segoe UI, Arial, sans-serif" font-size="33" font-weight="500" fill="#1D2823">
