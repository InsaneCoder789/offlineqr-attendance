name: Android 16 KB Compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-16kb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: APK and native library alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - run: flutter build apk --debug
        working-directory: client
      - run: scripts/check_android_16kb.sh
