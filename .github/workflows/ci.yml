name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend protocol and database boundaries
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres@localhost/kiit_attendance_goal02
      PGHOST: localhost
      PGUSER: postgres
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pip-audit
      - run: scripts/db_reset.sh
      - run: scripts/db_test.sh
      - run: PYTHONPATH=. python -m unittest discover -s backend/tests -p 'test_*.py'
      - run: pip-audit -r backend/requirements.txt

  faculty-portal:
    name: Faculty portal type, unit, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faculty-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: faculty-portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  student-app:
    name: Student app static and unit boundaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  container-boundaries:
    name: Release container build boundaries
    runs-on: ubuntu-latest
    needs: [backend, faculty-portal]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: offlineqr/backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: faculty-portal
          push: false
          tags: offlineqr/faculty-portal:ci
