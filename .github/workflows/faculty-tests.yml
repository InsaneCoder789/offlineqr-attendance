name: Faculty Portal Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: faculty-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Portal unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faculty-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: faculty-portal/package-lock.json
      - run: npm ci
      - run: npm test
